name: 24/7 Research Scraper

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch: # Manual trigger button

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run research scraper
        run: python scraper.py

      - name: Commit results
        run: |
          git config user.name "Geuphoria Research Bot"
          git config user.email "bot@geuphoria.media"
          git add data/
          git diff --staged --quiet || git commit -m "Research scan $(date -u +%Y-%m-%d_%H:%M)"
          git push
